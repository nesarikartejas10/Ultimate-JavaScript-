<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Background Color</title>
    <script src="./setInterval_Project.js" defer></script>
    <style>
      button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 10px;
        border: none;
        outline: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0px 0px 10px rgb(0, 0, 0, 0.3);
        font-size: 18px;
      }

      button:hover {
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.59);
      }
    </style>
  </head>
  <body>
    <button>Stop Changing Color</button>
  </body>
</html>
