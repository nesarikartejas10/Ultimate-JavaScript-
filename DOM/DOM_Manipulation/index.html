<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Manipulation</title>
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1 id="heading">Javascript is awesome!</h1>
    <h1>This is another heading</h1>
    <p class="para">This is para 1</p>
    <p class="para">This is para 2</p>
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ul>

    <div class="parent">
      <h1 class="head">Javascript is awesome!</h1>
      <h3>this is sub heading</h3>
    </div>

    <div class="container">
      <h3 id="title">DOM Events</h3>
      <button id="button">click</button>
    </div>

    <!-- Mini project -->
    <div class="bulb-container">
      <img class="bulb" src="./images/bulb-off.gif" alt="bulb-off" />
      <button class="btn">Turn On</button>
    </div>
  </body>
</html>
