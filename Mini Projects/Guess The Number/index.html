<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess The Number</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,100&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Guess the number</h1>
    <hr />
    <label for="input"><strong>Enter a guess between 0 to 100</strong></label>
    <br />
    <br />
    <form>
      <input
        type="number"
        id="input"
        placeholder="Enter a number"
        min="0"
        max="100"
        required
      />
      <div>
        <button class="btn submit-btn">Submit</button>
        <button type="button" class="btn start-btn" disabled>Start Game</button>
      </div>
    </form>
    <p class="result"></p>
    <p class="all-guesses"></p>
  </body>
</html>
