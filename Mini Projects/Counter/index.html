<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,100&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>Counter</header>
    <hr />
    <h1 class="count">0</h1>
    <button class="btn minus-btn">-</button>
    <button class="btn plus-btn">+</button>
    <div class="change">
      Increment/Decrement by:
      <input type="number" id="changeBy" value="1" min="0" max="10" />
    </div>
    <button class="btn reset-btn">Reset</button>
  </body>
</html>
