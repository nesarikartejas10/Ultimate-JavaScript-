<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constructor Function</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Constructor Function</h1>
    <form id="accountForm">
      <input type="text" id="accountName" placeholder="Enter account name" />
      <input type="number" id="balance" placeholder="Enter Initial balance" />
      <button type="submit">Create Account</button>
    </form>
    <hr />
    <form id="depositForm">
      <input
        type="number"
        id="accountNumber"
        placeholder="Enter account number"
      />
      <input
        type="number"
        id="depositAmount"
        placeholder="Enter deposit amount"
      />
      <button type="submit">Deposit Amount</button>
    </form>
    <hr />
    <form id="withdrawalForm">
      <input
        type="number"
        id="accountNumber"
        placeholder="Enter account number"
      />
      <input
        type="number"
        id="withdrawalAmount"
        placeholder="Enter withdrawal amount"
      />
      <button type="submit">Withdrawal Amount</button>
    </form>
  </body>
</html>
